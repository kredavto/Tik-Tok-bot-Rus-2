name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tiktok_loader
          POSTGRES_USER: tiktok
          POSTGRES_PASSWORD: tiktok
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Check migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tiktok:tiktok@localhost:5432/tiktok_loader
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: test
          TOKEN_ENCRYPTION_KEY: 9W1mZtdJKTcB1nngTse05IiRsfD91qAHBDAa4pRJU-o=
        run: alembic upgrade head
      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://tiktok:tiktok@localhost:5432/tiktok_loader
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: test
          TOKEN_ENCRYPTION_KEY: 9W1mZtdJKTcB1nngTse05IiRsfD91qAHBDAa4pRJU-o=
        run: pytest
      - name: Docker build
        run: docker compose build
      - name: Secret scan
        run: detect-secrets scan --all-files --exclude-files '\.git/.*|\.env\.example'
