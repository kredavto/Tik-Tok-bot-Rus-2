[project]
name = "tik-tok-bot-rus-2"
version = "0.2.0"
description = "Telegram bot with Stars billing and official TikTok posting workflow"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.10,<4",
  "aiofiles>=24.1,<25",
  "aiohttp>=3.9,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=42,<45",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.111,<1",
  "greenlet>=3.0,<4",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.3,<3",
  "python-multipart>=0.0.9,<1",
  "redis>=5.0,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "mypy>=1.10,<2",
  "pypdf>=4,<6",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "types-aiofiles>=24.1,<25",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.bot" = ["locales/*.json"]
"app.admin_ui" = ["static/*.html", "static/*.css", "static/*.js"]
"app.public" = ["*.html", "static/*.css", "static/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = true
