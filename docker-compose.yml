x-app-service: &app-service
  build: .
  image: ${APP_IMAGE:-tik-tok-loader}:${APP_VERSION:-dev}
  restart: unless-stopped
  env_file:
    - .env
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - internal

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiktok_loader}
      POSTGRES_USER: ${POSTGRES_USER:-tiktok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiktok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiktok} -d ${POSTGRES_DB:-tiktok_loader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app-service
    restart: "no"
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  runtime-init:
    <<: *app-service
    user: root
    restart: "no"
    command: >
      sh -c "chown -R appuser:appuser /app/data /app/backups
      && chmod 0750 /app/data /app/backups"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

  api:
    <<: *app-service
    command: >
      uvicorn app.api.main:app --host ${APP_HOST:-0.0.0.0}
      --port ${APP_PORT:-8080} --workers ${API_WORKERS:-1} --no-access-log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-init:
        condition: service_completed_successfully
    expose:
      - "${APP_PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8080}/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    <<: *app-service
    command: python -m app.bot.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

  worker:
    <<: *app-service
    command: >
      sh -c "dramatiq app.workers.tasks
      --processes ${DRAMATIQ_PROCESSES:-1}
      --threads ${DRAMATIQ_THREADS:-4}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

  scheduler:
    <<: *app-service
    command: python -m app.workers.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.scheduler", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx/templates/${NGINX_TEMPLATE:-http.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
      - ./deploy/nginx/acme:/var/www/certbot:ro
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
  public:
